name: Barrido de descubrimiento

# Recorre el universo EDGAR por lotes, buscando candidatas NUEVAS que
# todavía no se han evaluado nunca (o hace mucho que no les toca turno).
# Para mantener al día las que YA tienen un análisis guardado, ver
# refresco.yml — es una cola totalmente aparte.
#
# Nov-2026: GitHub dejaba caer casi todas las ejecuciones programadas «en
# punto» (solo salía ~1 al día de 6). Ahora va cada 2 horas en un minuto poco
# concurrido, con lotes de 400 y prioridad a las empresas de índices (ver
# run_universo.py). Lo que pasa el cribado y no cabe en el cupo de IA queda
# en cola para la siguiente ejecución.

on:
  schedule:
    - cron: "17 */2 * * *"      # cada 2 horas, minuto 17, en UTC
  workflow_dispatch:
    inputs:
      lote:
        description: "Tickers a procesar en esta ejecución"
        required: false
        default: "400"
      max_ia:
        description: "Máximo de llamadas a la IA en esta ejecución"
        required: false
        default: "25"
      solo_cribado:
        description: "Solo cribar, sin llamar a la IA"
        type: boolean
        required: false
        default: false
      ronda_dias:
        description: "Repasar las empresas de índices vistas hace más de N días (0 = repasarlas todas ya)"
        required: false
        default: "45"
      solo_estado:
        description: "No procesar nada: solo mostrar cómo va el barrido"
        type: boolean
        required: false
        default: false

concurrency:
  group: barrido
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # una ronda grande (lote 1.500) tarda ~2-3 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ejecutar siguiente lote
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >
          python run_universo.py
          --lote ${{ github.event.inputs.lote || '400' }}
          --max-ia ${{ github.event.inputs.max_ia || '25' }}
          ${{ (github.event.inputs.solo_cribado == 'true') && '--solo-cribado' || '' }}
          --ronda-dias ${{ github.event.inputs.ronda_dias || '45' }}
          ${{ (github.event.inputs.solo_estado == 'true') && '--estado' || '' }}
