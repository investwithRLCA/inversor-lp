name: Barrido de descubrimiento

# Recorre el universo EDGAR por lotes, buscando candidatas NUEVAS que
# todavía no se han evaluado nunca (o hace mucho que no les toca turno).
# Para mantener al día las que YA tienen un análisis guardado, ver
# refresco.yml — es una cola totalmente aparte.
#
# Antes corría 1 vez al día; con el cuello de botella de la descarga
# repetida del listado de tickers ya arreglado (ver providers.py) y el
# cribado en paralelo, cada ejecución es varias veces más rápida, así que
# ahora corre cada 4 horas (6 veces al día) para cubrir el universo mucho
# antes.

on:
  schedule:
    - cron: "0 */4 * * *"       # cada 4 horas, en UTC
  workflow_dispatch:
    inputs:
      lote:
        description: "Tickers a procesar en esta ejecución"
        required: false
        default: "100"
      max_ia:
        description: "Máximo de llamadas a la IA en esta ejecución"
        required: false
        default: "20"
      solo_cribado:
        description: "Solo cribar, sin llamar a la IA"
        type: boolean
        required: false
        default: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ejecutar siguiente lote
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >
          python run_universo.py
          --lote ${{ github.event.inputs.lote || '100' }}
          --max-ia ${{ github.event.inputs.max_ia || '20' }}
          ${{ (github.event.inputs.solo_cribado == 'true') && '--solo-cribado' || '' }}
