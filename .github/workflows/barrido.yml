name: Barrido de descubrimiento

# Recorre el universo EDGAR por lotes, buscando candidatas NUEVAS que
# todavía no se han evaluado nunca (o hace mucho que no les toca turno).
# Para mantener al día las que YA tienen un análisis guardado, ver
# refresco.yml — es una cola totalmente aparte.
#
# Nov-2026: GitHub dispara muy pocas ejecuciones programadas en este repositorio
# (a veces una al día). Por eso cada ejecución hace bastante: lote de 400 con
# prioridad a las empresas de índices (ver run_universo.py; con repasar cada
# 45 días basta ~1 ejecución al día), hasta 60 análisis de IA (la cola de lo que
# pasó el cribado y no cupo antes; si Gemini se queda sin cupo, para y lo deja
# en cola) y, al final, el refresco de las tesis ya analizadas.

on:
  schedule:
    - cron: "17 */2 * * *"      # cada 2 horas, minuto 17, en UTC
  workflow_dispatch:
    inputs:
      lote:
        description: "Tickers a procesar en esta ejecución"
        required: false
        default: "400"
      max_ia:
        description: "Máximo de llamadas a la IA en esta ejecución"
        required: false
        default: "60"
      solo_cribado:
        description: "Solo cribar, sin llamar a la IA"
        type: boolean
        required: false
        default: false
      ronda_dias:
        description: "Repasar las empresas de índices vistas hace más de N días (0 = repasarlas todas ya)"
        required: false
        default: "45"
      solo_estado:
        description: "No procesar nada: solo mostrar cómo va el barrido"
        type: boolean
        required: false
        default: false

concurrency:
  group: barrido
  cancel-in-progress: false

jobs:
  barrido:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # una ronda grande (lote 1.500) tarda ~2-3 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ejecutar siguiente lote
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: >
          python run_universo.py
          --lote ${{ github.event.inputs.lote || '400' }}
          --max-ia ${{ github.event.inputs.max_ia || '60' }}
          ${{ (github.event.inputs.solo_cribado == 'true') && '--solo-cribado' || '' }}
          --ronda-dias ${{ github.event.inputs.ronda_dias || '45' }}
          ${{ (github.event.inputs.solo_estado == 'true') && '--estado' || '' }}

      # GitHub dispara muy pocas ejecuciones programadas en este repositorio (a veces
      # una al día) y refresco.yml casi nunca salta solo: por eso cada barrido refresca
      # también las tesis ya analizadas. Si no hay datos nuevos es gratis (caché).
      - name: Refrescar las empresas ya analizadas
        if: ${{ github.event.inputs.solo_estado != 'true' && github.event.inputs.solo_cribado != 'true' }}
        continue-on-error: true
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python refrescar.py --limite 30
