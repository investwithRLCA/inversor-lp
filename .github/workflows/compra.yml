name: Compra del mes (lista para el atajo del iPhone)

# Publica UNA vez al mes la lista de la compra en docs/compra/lista.json (empresas de
# cada sección con su ticker de Trading 212 y su precio de ese momento, cambio euro/dólar
# y tope por empresa) y te avisa en el móvil (app ntfy, secreto NTFY_TOPIC). Tú compras
# cuando quieras desde Vigía con «Comprar ahora»: el script «Vigia Compra» del iPhone (app
# Scriptable) reparte tu importe —que solo está en tu iPhone— con la misma regla que Vigía
# y compra en Trading 212. Solo compra: nunca vende.
#
# Avisos al móvil: cuando la lista ya se ve en la web; los días 3 y 7 si aún no hay
# informe del mes; con «forzar», un aviso de PRUEBA.
#
# Cuándo: el primer día de bolsa de EE. UU. de cada mes, a las 15:07 UTC (16:07 en
# España en invierno, 17:07 en verano), con la bolsa abierta en verano y en invierno.
# Se intenta los días 1 a 10: si ese día la bolsa está cerrada (fin de semana o
# festivo) no hace nada, y en cuanto publica la lista del mes ya no la vuelve a tocar.
# (No se filtra por día de la semana en el cron: con día del mes y día de la semana
# a la vez, cron ejecuta si se cumple CUALQUIERA de los dos.)
#
# A mano («Run workflow»): con «forzar» genera ya una lista de PRUEBA aunque la bolsa
# esté cerrada. Va marcada "prueba": el iPhone solo la compra en la cuenta Practice,
# nunca con dinero real, y nunca sustituye a la lista real del mes si ya existe.
#
# Solo datos públicos de empresas: nada de tu cartera ni de tu importe.

on:
  schedule:
    - cron: "7 15 1-10 * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Generar ya una lista de PRUEBA (solo se compra en la cuenta Practice)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: compra-del-mes
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-mensual.txt

      - name: Generar la lista de la compra
        id: lista
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FORZAR: ${{ github.event.inputs.forzar || 'false' }}
        run: |
          EXTRA=""
          if [ "$FORZAR" = "true" ]; then EXTRA="--forzar"; fi
          python -m mensual.compra_t212 --salida ../docs/compra --precios-vivos $EXTRA

      - name: Publicarla
        id: publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d docs/compra ] || { echo "Sin lista."; exit 0; }
          git add docs/compra
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Compra del mes: lista para Trading 212"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Avisar al móvil (ntfy)
        if: always()
        working-directory: backend
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUBLICADA: ${{ steps.lista.outputs.publicada }}
          PRUEBA: ${{ steps.lista.outputs.prueba }}
          SIN_LISTA: ${{ steps.lista.outputs.sin_lista }}
          PUBLICAR: ${{ steps.publicar.outcome }}
        run: |
          # Solo se anuncia una lista si de verdad se subió (y se espera a que la web la muestre).
          if [ -n "$PUBLICADA" ] && [ "$PUBLICAR" = "success" ]; then python3 -m mensual.avisos lista --mes "$PUBLICADA"; fi
          if [ -n "$PRUEBA" ] && [ "$PUBLICAR" = "success" ]; then python3 -m mensual.avisos lista --mes "$PRUEBA" --prueba; fi
          if [ -n "$SIN_LISTA" ]; then python3 -m mensual.avisos sin-lista --mes "$SIN_LISTA"; fi
          exit 0
