name: Compra del mes (lista para el atajo del iPhone)

# Publica UNA vez al mes la lista de la compra en docs/compra/lista.json (empresas de
# cada sección con su ticker de Trading 212 y su precio, cambio euro/dólar y tope por
# empresa), te avisa en el móvil (app ntfy, secreto NTFY_TOPIC) y, el resto del mes, le
# pone los precios al día cada hora con la bolsa abierta. Tú compras
# cuando quieras desde Vigía con «Comprar ahora»: el script «Vigia Compra» del iPhone (app
# Scriptable) reparte tu importe —que solo está en tu iPhone— con la misma regla que Vigía
# y compra en Trading 212. Solo compra: nunca vende.
#
# Avisos al móvil: cuando la lista del mes ya se ve en la web; del día 3 al 10 si aún no
# hay informe del mes; con «forzar», un aviso de PRUEBA. Los precios al día no avisan.
#
# Cuándo: cada hora a y 7, de lunes a viernes, de 13:07 a 21:07 UTC; solo hace
# algo si la bolsa de EE. UU. está abierta en ese momento (lo mira con el SPY: cubre festivos y
# el cambio de hora de verano).
#  · Si aún no hay lista de este mes (y ya está el informe del mes), la publica — será en la
#    primera hora con la bolsa abierta del primer día de bolsa del mes (≈15:07 UTC en invierno,
#    ≈14:07 en verano) — y te avisa en el móvil.
#  · Si ya está, le pone los precios de ese momento: MISMAS empresas, solo cambian los precios
#    y el cambio euro/dólar. Así, compres el día que compres, el reparto sale con precios de esa
#    hora. Sin aviso al móvil.
#  · Del día 3 al 10, si aún no hay informe del mes, te avisa (una vez al día).
#
# A mano («Run workflow»): con «forzar» genera ya una lista de PRUEBA aunque la bolsa
# esté cerrada. Va marcada "prueba": el iPhone solo la compra en la cuenta Practice,
# nunca con dinero real, y nunca sustituye a la lista real del mes si ya existe.
#
# Solo datos públicos de empresas: nada de tu cartera ni de tu importe.

on:
  schedule:
    - cron: "7 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Generar ya una lista de PRUEBA (solo se compra en la cuenta Practice)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: compra-del-mes
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-mensual.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-mensual.txt

      - name: Generar la lista de la compra
        id: lista
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FORZAR: ${{ github.event.inputs.forzar || 'false' }}
        run: |
          EXTRA=""
          if [ "$FORZAR" = "true" ]; then EXTRA="--forzar"; fi
          python -m mensual.compra_t212 --salida ../docs/compra --precios-vivos $EXTRA

      - name: Publicarla
        id: publicar
        env:
          REFRESCADA: ${{ steps.lista.outputs.refrescada }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d docs/compra ] || { echo "Sin lista."; exit 0; }
          git add docs/compra
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          if [ -n "$REFRESCADA" ]; then MSG="Compra del mes: precios al día ($(date -u +%H:%M) UTC)"; else MSG="Compra del mes: lista para Trading 212"; fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Avisar al móvil (ntfy)
        if: always()
        working-directory: backend
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUBLICADA: ${{ steps.lista.outputs.publicada }}
          PRUEBA: ${{ steps.lista.outputs.prueba }}
          SIN_LISTA: ${{ steps.lista.outputs.sin_lista }}
          PUBLICAR: ${{ steps.publicar.outcome }}
        run: |
          # Solo se anuncia una lista si de verdad se subió (y se espera a que la web la muestre).
          if [ -n "$PUBLICADA" ] && [ "$PUBLICAR" = "success" ]; then python3 -m mensual.avisos lista --mes "$PUBLICADA"; fi
          if [ -n "$PRUEBA" ] && [ "$PUBLICAR" = "success" ]; then python3 -m mensual.avisos lista --mes "$PRUEBA" --prueba; fi
          if [ -n "$SIN_LISTA" ]; then python3 -m mensual.avisos sin-lista --mes "$SIN_LISTA"; fi
          exit 0
