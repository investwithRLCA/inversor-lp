name: Compra del mes (lista para el atajo del iPhone)

# Publica UNA vez al mes la lista de la compra en docs/compra/lista.json (empresas de
# cada sección con su ticker de Trading 212 y su precio, cambio euro/dólar y tope por
# empresa), te avisa en el móvil (app ntfy, secreto NTFY_TOPIC) y, el resto del mes, le
# pone los precios al día cada hora con la bolsa abierta. Tú compras
# cuando quieras desde Vigía con «Comprar ahora»: el script «Vigia Compra» del iPhone (app
# Scriptable) reparte tu importe —que solo está en tu iPhone— con la misma regla que Vigía
# y compra en Trading 212. Solo compra: nunca vende.
#
# Avisos al móvil: cuando la lista del mes ya se ve en la web; del día 3 al 10 si aún no
# hay informe del mes; con «forzar», un aviso de PRUEBA. Los precios al día no avisan.
#
# Cuándo: lo lanza cada hora (a y 7, de 13:07 a 21:07 UTC, de lunes a viernes) el reloj de Supabase
# (pg_cron, ver backend/sql/reloj_supabase.sql), que sí es puntual; las programadas de aquí abajo
# quedan de reserva (GitHub retrasa o se salta muchas: el 27-nov no lanzó ni una). Casi todas acaban en
# medio minuto (primer paso: si la lista del mes ya está y la bolsa de EE. UU. está cerrada —lo
# mira con el SPY: cubre festivos y el cambio de hora—, no hace nada más).
#  · Si aún no hay lista de este mes: normalmente ya la publica el «Recomendador mensual» al
#    terminar el informe; si no, la publica esta (en cuanto esté el informe del mes) y te avisa.
#  · Si ya está, le pone los precios de ese momento: MISMAS empresas, solo cambian los precios
#    y el cambio euro/dólar. Así, compres el día que compres, el reparto sale con precios de esa
#    hora. Sin aviso al móvil.
#  · Del día 3 al 10, si aún no hay informe del mes, te avisa (una vez al día).
#
# A mano («Run workflow»): con «forzar» genera ya una lista de PRUEBA aunque la bolsa
# esté cerrada. Va marcada "prueba": el iPhone solo la compra en la cuenta Practice,
# nunca con dinero real, y nunca sustituye a la lista real del mes si ya existe.
#
# Solo datos públicos de empresas: nada de tu cartera ni de tu importe.

on:
  schedule:
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Generar ya una lista de PRUEBA (solo se compra en la cuenta Practice)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: compra-del-mes
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: ¿Hay algo que hacer?
        id: pre
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FORZAR: ${{ github.event.inputs.forzar || 'false' }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          from datetime import datetime, timezone
          ahora = datetime.now(timezone.utc)
          hay = os.path.exists(f"docs/compra/lista-{ahora:%Y-%m}.json")
          def abierta():
              try:
                  url = "https://finnhub.io/api/v1/quote?symbol=SPY&token=" + os.environ.get("FINNHUB_API_KEY", "")
                  with urllib.request.urlopen(url, timeout=20) as r:
                      t = float(json.load(r).get("t") or 0)
                  return bool(t) and time.time() - t < 20 * 60
              except Exception as e:
                  print("Finnhub no responde:", type(e).__name__, "→ se decide por el horario")
                  m = ahora.hour * 60 + ahora.minute
                  return ahora.weekday() < 5 and 15 * 60 <= m <= 19 * 60 + 30
          if os.environ.get("FORZAR") == "true":
              hacer = True
          elif not hay:
              hacer = True        # falta la lista del mes: mirar el informe (y avisar si no está)
          else:
              hacer = abierta()   # ya está: solo hay que ponerle precios si la bolsa está abierta
          print(f"Lista de {ahora:%Y-%m}:", "sí" if hay else "no", "· bolsa/trabajo:", "sí" if hacer else "nada que hacer")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"hacer={'true' if hacer else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.pre.outputs.hacer == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-mensual.txt

      - name: Instalar dependencias
        if: steps.pre.outputs.hacer == 'true'
        working-directory: backend
        run: pip install -r requirements-mensual.txt

      - name: Generar la lista de la compra
        id: lista
        if: steps.pre.outputs.hacer == 'true'
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FORZAR: ${{ github.event.inputs.forzar || 'false' }}
        run: |
          EXTRA=""
          if [ "$FORZAR" = "true" ]; then EXTRA="--forzar"; fi
          python -m mensual.compra_t212 --salida ../docs/compra --precios-vivos $EXTRA

      - name: Publicarla
        id: publicar
        if: steps.pre.outputs.hacer == 'true'
        env:
          REFRESCADA: ${{ steps.lista.outputs.refrescada }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d docs/compra ] || { echo "Sin lista."; exit 0; }
          git add docs/compra
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          if [ -n "$REFRESCADA" ]; then MSG="Compra del mes: precios al día ($(date -u +%H:%M) UTC)"; else MSG="Compra del mes: lista para Trading 212"; fi
          git commit -m "$MSG"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      - name: Avisar al móvil (ntfy)
        if: always() && steps.pre.outputs.hacer == 'true'
        working-directory: backend
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUBLICADA: ${{ steps.lista.outputs.publicada }}
          PRUEBA: ${{ steps.lista.outputs.prueba }}
          SIN_LISTA: ${{ steps.lista.outputs.sin_lista }}
          PUBLICAR: ${{ steps.publicar.outcome }}
        run: |
          # Solo se anuncia una lista si de verdad se subió (y se espera a que la web la muestre).
          if [ -n "$PUBLICADA" ] && [ "$PUBLICAR" = "success" ]; then python3 -m mensual.avisos lista --mes "$PUBLICADA"; fi
          if [ -n "$PRUEBA" ] && [ "$PUBLICAR" = "success" ]; then python3 -m mensual.avisos lista --mes "$PRUEBA" --prueba; fi
          if [ -n "$SIN_LISTA" ]; then python3 -m mensual.avisos sin-lista --mes "$SIN_LISTA"; fi
          exit 0
