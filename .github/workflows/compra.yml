name: Compra del mes (lista para el atajo del iPhone)

# Publica UNA vez al mes la lista de la compra de cada sección en docs/compra/
# (empresas, ticker de Trading 212, peso y acciones por cada 100 €), con los precios
# de ese momento. La lee el atajo «Vigia Compra» del iPhone, que compra en Trading 212
# con el importe que vive solo en el atajo. Solo compra: nunca vende.
#
# Cuándo: el primer día de bolsa de EE. UU. de cada mes, a las 15:07 UTC (16:07 en
# España en invierno, 17:07 en verano), con la bolsa abierta en verano y en invierno.
# Se intenta los días 1 a 10: si ese día la bolsa está cerrada (fin de semana o
# festivo) no hace nada, y en cuanto publica la lista del mes ya no la vuelve a tocar.
# (No se filtra por día de la semana en el cron: con día del mes y día de la semana
# a la vez, cron ejecuta si se cumple CUALQUIERA de los dos.)
#
# A mano («Run workflow»): con «forzar» genera la lista ya, aunque la bolsa esté
# cerrada o ya exista (solo para probar en la cuenta Practice).
#
# Solo datos públicos de empresas: nada de tu cartera ni de tu importe.

on:
  schedule:
    - cron: "7 15 1-10 * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Generar ya aunque la bolsa esté cerrada o la lista del mes ya exista (solo pruebas)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: compra-del-mes
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-mensual.txt

      - name: Generar la lista de la compra
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FORZAR: ${{ github.event.inputs.forzar || 'false' }}
        run: |
          EXTRA=""
          if [ "$FORZAR" = "true" ]; then EXTRA="--forzar"; fi
          python -m mensual.compra_t212 --salida ../docs/compra --precios-vivos $EXTRA

      - name: Publicarla
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d docs/compra ] || { echo "Sin lista."; exit 0; }
          git add docs/compra
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Compra del mes: lista para Trading 212"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
