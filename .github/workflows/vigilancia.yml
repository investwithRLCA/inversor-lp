name: Vigilancia de precio

# Comprueba el precio actual (vía Finnhub) de todas las empresas marcadas
# VIGILAR con un precio de entrada calculado, y abre un Issue en este
# repositorio cuando alguna ha cruzado ese precio. No llama a la IA — es
# barato y rápido, así que corre cada 2 horas.
#
# El Issue se ASIGNA al propietario del repositorio y lleva la etiqueta
# "alerta-compra": GitHub notifica a la persona asignada a un Issue según
# su configuración de notificaciones (perfil → Settings → Notifications),
# igual en la app de GitHub para el móvil, así que el aviso llega aunque
# no tengas activado "Watching → All activity" en este repositorio.
#
# MODO PRUEBA: para comprobar HOY que el aviso te llega de verdad, sin
# esperar a que una empresa real cruce su precio, lanza este workflow a
# mano (pestaña "Actions" → "Vigilancia de precio" → "Run workflow") con
# "prueba" en true. Crea un Issue de prueba al momento, sin tocar Supabase
# ni Finnhub.

on:
  schedule:
    - cron: "0 */2 * * *"       # cada 2 horas, en UTC
  workflow_dispatch:
    inputs:
      prueba:
        description: "Crear un Issue de prueba ahora mismo (para comprobar que el aviso llega)"
        type: boolean
        required: false
        default: false

permissions:
  issues: write

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.prueba != 'true' }}
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        if: ${{ github.event.inputs.prueba != 'true' }}
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Comprobar precios
        if: ${{ github.event.inputs.prueba != 'true' }}
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python vigilar.py --salida alertas.json

      - name: Abrir Issue si hay alertas (o si es una prueba)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const esPrueba = ${{ github.event.inputs.prueba == 'true' }};
            const propietario = context.repo.owner;

            let alertas = [];
            if (esPrueba) {
              alertas = [{
                ticker: "PRUEBA",
                nombre: "Empresa de prueba",
                precio_actual: 99.9,
                precio_entrada: 100,
              }];
            } else if (fs.existsSync('backend/alertas.json')) {
              alertas = JSON.parse(fs.readFileSync('backend/alertas.json', 'utf8'));
            }

            if (alertas.length === 0) {
              console.log('Sin alertas — no se abre ningún Issue.');
              return;
            }

            // Asegura que la etiqueta exista antes de usarla (si no, créala).
            const ETIQUETA = 'alerta-compra';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: ETIQUETA,
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: ETIQUETA,
                color: 'b60205',
                description: 'Aviso automático: una vigilada ha cruzado su precio de entrada',
              });
            }

            const fecha = new Date().toISOString().slice(0, 10);
            const cuerpo = alertas.map(a =>
              `- **${a.ticker}** (${a.nombre || 's/n'}): precio actual ${a.precio_actual} ≤ entrada ${a.precio_entrada}`
            ).join('\n');

            const titulo = esPrueba
              ? 'Prueba de vigilancia: el aviso funciona ✅'
              : `Vigilancia ${fecha}: ${alertas.length} empresa(s) en zona de compra`;

            const nota = esPrueba
              ? '\n\n_Este es un Issue de prueba, generado a mano desde "Run workflow". ' +
                'Si te ha llegado un aviso (correo, notificación del móvil...), el mecanismo funciona de verdad._'
              : '';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: `@${propietario}\n\n${cuerpo}${nota}`,
              assignees: [propietario],
              labels: [ETIQUETA],
            });
