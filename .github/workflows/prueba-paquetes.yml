name: Prueba histórica de los paquetes

# ¿Habrían batido al S&P 500 los paquetes del módulo mensual (1–3, 3–5 y 5+ años)?
#
# Reconstruye, mes a mes desde 2015, lo que habría elegido cada paquete con las
# cuentas TAL COMO SE CONOCÍAN en cada fecha (la SEC guarda cuándo se presentó cada
# cifra) y mide qué rindió a 12, 24 y 36 meses frente al S&P 500 y frente a una
# selección sin criterio del mismo listado. Ejecuta el mismo código del bot.
#
# Lanzarlo a mano: pestaña "Actions" → "Prueba histórica de los paquetes" → "Run workflow".
# El resultado aparece en la página de la ejecución (resumen). Tarda 20-40 minutos
# la primera vez (descarga las cuentas de ~500 empresas); las siguientes veces usa la caché.
# Solo usa datos públicos de empresas: nada de tu cartera.

on:
  workflow_dispatch:
    inputs:
      max_empresas:
        description: "Solo para pruebas: limitar a las N primeras empresas (0 = todas)"
        type: string
        required: false
        default: "0"
      inicio:
        description: "Primera fecha de selección (AAAA-MM-DD)"
        type: string
        required: false
        default: "2015-01-01"

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-backtest.txt

      - name: Recuperar las cuentas de la SEC ya descargadas
        uses: actions/cache/restore@v4
        with:
          path: backend/.cache_pit
          key: pit-v1-${{ github.run_id }}
          restore-keys: |
            pit-v1-

      - name: Probar los paquetes en el histórico
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          MAX_EMPRESAS: ${{ github.event.inputs.max_empresas || '0' }}
          INICIO: ${{ github.event.inputs.inicio || '2015-01-01' }}
        run: |
          N="${MAX_EMPRESAS//[^0-9]/}"
          python -W ignore -m mensual.prueba_calidad --max-empresas "${N:-0}" --inicio "$INICIO" --salida resultados_calidad

      - name: Guardar las cuentas descargadas para la próxima vez
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/.cache_pit
          key: pit-v1-${{ github.run_id }}

      - name: Mostrar el informe en la página de la ejecución
        if: always()
        run: |
          if [ -f backend/resultados_calidad/informe.md ]; then
            cat backend/resultados_calidad/informe.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó informe (mira el log del paso anterior)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prueba-paquetes
          path: backend/resultados_calidad/
          if-no-files-found: ignore
