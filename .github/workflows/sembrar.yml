name: Sembrar universo

# Carga el listado completo de tickers EDGAR (~10.000) en universe_progreso.
# Se ejecuta UNA SOLA VEZ (o si alguna vez quieres forzar un re-sembrado;
# no borra el progreso de los que ya existan, así que repetirlo no hace daño).
# Solo manual: no tiene sentido en un cron, por eso no lleva "schedule".

on:
  workflow_dispatch: {}

jobs:
  sembrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Sembrar universo completo
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python run_universo.py --sembrar
