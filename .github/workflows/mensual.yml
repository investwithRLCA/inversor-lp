name: Recomendador mensual

# Una vez al mes (día 1) — y cuando tú quieras a mano — toma TODAS las empresas
# que han pasado el cribado de calidad del bot (cientos, no solo las que tienen
# análisis de IA) y arma el paquete Peter Lynch de pequeñas (300–5.000 M$, el
# único que aprobó la prueba histórica) y la sección de small caps con dividendo
# que no recorta. Los paquetes de 1–3, 3–5 y
# 5+ años y Lynch en grandes están DESACTIVADOS: no pasaron la prueba histórica
# (workflows «Prueba histórica de los paquetes» y «… del filtro Lynch»). Pasa las
# finalistas por frenos (valor de la tesis, último trimestre publicado), mide
# cuánto rindieron las elecciones de los meses anteriores frente al S&P 500 (y
# los dividendos frente al Russell 2000), guarda el informe en Supabase para la
# pestaña «Este mes» del Vigía y abre un Issue.
#
# Lanzarlo a mano: pestaña "Actions" → "Recomendador mensual" → "Run workflow".
#
# PRIVACIDAD: este repositorio es público, así que el Issue y el resumen de
# esta ejecución contienen SOLO información de empresas. Tu cartera y tus
# importes no pasan nunca por aquí: se calculan en tu móvil.

# CUÁNDO: el día 1, varias veces (y el 2 de reserva), porque GitHub retrasa muchas horas o se salta
# a menudo las ejecuciones programadas (medido en este repositorio: 7-12 h de retraso). La primera
# que entra hace el informe; las demás miran en Supabase que ya está el de este mes y no hacen nada.
# Al terminar publica ya la lista de la compra del mes (con los precios del informe; luego «Compra
# del mes» los pone al día cada hora con la bolsa abierta) y te avisa en el móvil.

on:
  schedule:
    - cron: "17 0 1 * *"        # día 1: 00:17, 04:17, 08:17, 12:17, 16:17 y 20:17 UTC
    - cron: "17 4 1 * *"
    - cron: "17 8 1 * *"
    - cron: "17 12 1 * *"
    - cron: "17 16 1 * *"
    - cron: "17 20 1 * *"
    - cron: "17 4 2 * *"        # reserva: día 2, 04:17 y 14:17 UTC
    - cron: "17 14 2 * *"
  workflow_dispatch:
    inputs:
      crear_issue:
        description: "Abrir el Issue de aviso (desmárcalo si solo quieres refrescar los datos del Vigía)"
        type: boolean
        required: false
        default: true
      guardar:
        description: "Guardar el informe en Supabase (desmárcalo para una prueba que no toca la base de datos)"
        type: boolean
        required: false
        default: true
      con_dividendos:
        description: "Incluir la sección de small caps con dividendo (añade unos 15-25 minutos)"
        type: boolean
        required: false
        default: true

permissions:
  issues: write
  contents: write   # guarda la lista de valores de Trading 212 y la lista de la compra del mes

# Una ejecución detrás de otra: la de reserva espera y, al empezar, ve que el informe ya está.
concurrency:
  group: informe-mensual
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hacer: ${{ steps.mirar.outputs.hacer }}
    steps:
      - name: ¿Ya está el informe de este mes?
        id: mirar
        env:
          EVENTO: ${{ github.event_name }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from datetime import datetime, timezone
          mes = f"{datetime.now(timezone.utc):%Y-%m}"
          hacer = True
          if os.environ.get("EVENTO") == "schedule":           # a mano, siempre se hace
              url = os.environ["SUPABASE_URL"].rstrip("/") + f"/rest/v1/mensual_informes?select=mes&mes=eq.{mes}&limit=1"
              k = os.environ["SUPABASE_SERVICE_KEY"]
              try:
                  req = urllib.request.Request(url, headers={"apikey": k, "Authorization": "Bearer " + k})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      hacer = not json.load(r)
              except Exception as e:  # si no se puede mirar, se hace (mejor dos informes que ninguno)
                  print("No se pudo mirar Supabase:", type(e).__name__)
          print(f"Informe de {mes}:", "falta → se hace" if hacer else "ya está → no se repite")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"hacer={'true' if hacer else 'false'}\n")
          PY

  recomendar:
    needs: comprobar
    if: needs.comprobar.outputs.hacer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-mensual.txt

      - name: Generar el informe del mes
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Clave de Trading 212 SOLO con el permiso «Metadata» (lee el catálogo de valores;
          # no ve tu cuenta ni puede operar): las empresas que no están en Trading 212 no se invierten.
          T212_METADATA_KEY: ${{ secrets.T212_METADATA_KEY }}
          T212_METADATA_SECRET: ${{ secrets.T212_METADATA_SECRET }}
          GUARDAR: ${{ github.event.inputs.guardar || 'true' }}
          CON_DIV: ${{ github.event.inputs.con_dividendos || 'true' }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # Sin IA ni titulares: solo se usaban en el paquete de 1–3 años, que está desactivado.
          EXTRA="--sin-ia"
          if [ "$GUARDAR" != "true" ]; then EXTRA="$EXTRA --sin-supabase"; fi
          if [ "$CON_DIV" != "true" ]; then EXTRA="$EXTRA --sin-dividendos"; fi
          python -m mensual.recomendador $EXTRA \
            --salida informe_mensual.json --md issue_mensual.md \
            --url-dashboard "https://${OWNER}.github.io/${REPO}/"

      - name: Guardar la lista de valores de Trading 212 (solo si ha cambiado)
        if: always()
        run: |
          f=backend/mensual/t212_instrumentos.json
          [ -f "$f" ] || { echo "Sin lista de Trading 212."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$f"
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Trading 212: lista de valores disponibles actualizada"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "No se pudo guardar la lista (no es grave: el mes que viene se vuelve a consultar)."

      - name: Publicar la lista de la compra del mes (con los precios del informe)
        id: lista
        if: success() && (github.event.inputs.guardar || 'true') == 'true'
        continue-on-error: true     # si falla, la publica «Compra del mes» en su próxima pasada (no es fallo del informe)
        working-directory: backend
        run: python -m mensual.compra_t212 --informe informe_mensual.json --salida ../docs/compra

      - name: Subir la lista
        id: publicar
        if: success() && steps.lista.outputs.publicada != ''
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/compra
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Compra del mes: lista para Trading 212"
          for i in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          exit 1

      - name: Avisar al móvil de que ya está la lista (ntfy)
        if: success() && steps.lista.outputs.publicada != '' && steps.publicar.outcome == 'success'
        working-directory: backend
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -m mensual.avisos lista --mes "${{ steps.lista.outputs.publicada }}" || true

      - name: Mostrar el resumen en la página de la ejecución
        if: always()
        run: |
          if [ -f backend/issue_mensual.md ]; then
            cat backend/issue_mensual.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó informe (mira el log del paso anterior)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Abrir el Issue de aviso
        if: ${{ github.event.inputs.crear_issue != 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const propietario = context.repo.owner;
            const inf = JSON.parse(fs.readFileSync('backend/informe_mensual.json', 'utf8'));
            const cuerpoMd = fs.readFileSync('backend/issue_mensual.md', 'utf8');

            const ETIQUETA = 'mensual';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: ETIQUETA,
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: ETIQUETA,
                color: '1d76db',
                description: 'Aviso mensual: oportunidades baratas frente a su propio historial',
              });
            }

            const paq = inf.paquetes || {};
            const nDiv = inf.dividendos && inf.dividendos.candidatas ? inf.dividendos.candidatas.length : null;
            let titulo;
            if (paq.medio || paq.largo || paq.lynch_g || paq.lynch_p || paq.calidad_g || nDiv != null) {
              const etiquetas = [['corto', '1–3 años'], ['medio', '3–5 años'], ['largo', '5+ años'],
                                 ['lynch_p', 'pequeñas'], ['calidad_g', 'grandes'], ['lynch_g', 'grandes (Lynch)']];
              const partes = etiquetas.filter(([k]) => paq[k]).map(([k, e]) => `${e} ${paq[k].candidatas.length}`);
              if (nDiv != null) partes.push(`dividendos ${nDiv}`);
              titulo = `📅 ${inf.mes}: ${partes.join(' · ')}`;
            } else {
              const n = inf.resumen.n_candidatas;
              titulo = n === 0
                ? `📅 ${inf.mes}: nada claramente barato este mes`
                : `📅 ${inf.mes}: ${n} candidata${n === 1 ? '' : 's'} — ${inf.candidatas.map(c => c.ticker).join(', ')}`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: `@${propietario}\n\n${cuerpoMd}`,
              assignees: [propietario],
              labels: [ETIQUETA],
            });

      - name: Guardar el informe como archivo descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-mensual
          path: |
            backend/informe_mensual.json
            backend/issue_mensual.md
          if-no-files-found: ignore

      - name: Avisar al móvil si el informe ha fallado (ntfy)
        if: failure()
        working-directory: backend
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 -m mensual.avisos fallo-informe || true
