name: Recomendador mensual

# Una vez al mes (día 1) — y cuando tú quieras a mano — toma TODAS las empresas
# que han pasado el cribado de calidad del bot (cientos, no solo las que tienen
# análisis de IA) y arma el paquete Peter Lynch de pequeñas (300–5.000 M$, el
# único que aprobó la prueba histórica) y la sección de small caps con dividendo
# que no recorta. Los paquetes de 1–3, 3–5 y
# 5+ años y Lynch en grandes están DESACTIVADOS: no pasaron la prueba histórica
# (workflows «Prueba histórica de los paquetes» y «… del filtro Lynch»). Pasa las
# finalistas por frenos (valor de la tesis, último trimestre publicado), mide
# cuánto rindieron las elecciones de los meses anteriores frente al S&P 500 (y
# los dividendos frente al Russell 2000), guarda el informe en Supabase para la
# pestaña «Este mes» del Vigía y abre un Issue.
#
# Lanzarlo a mano: pestaña "Actions" → "Recomendador mensual" → "Run workflow".
#
# PRIVACIDAD: este repositorio es público, así que el Issue y el resumen de
# esta ejecución contienen SOLO información de empresas. Tu cartera y tus
# importes no pasan nunca por aquí: se calculan en tu móvil.

on:
  schedule:
    - cron: "17 11 1 * *"       # día 1 de cada mes, 11:17 UTC
  workflow_dispatch:
    inputs:
      crear_issue:
        description: "Abrir el Issue de aviso (desmárcalo si solo quieres refrescar los datos del Vigía)"
        type: boolean
        required: false
        default: true
      guardar:
        description: "Guardar el informe en Supabase (desmárcalo para una prueba que no toca la base de datos)"
        type: boolean
        required: false
        default: true
      con_dividendos:
        description: "Incluir la sección de small caps con dividendo (añade unos 15-25 minutos)"
        type: boolean
        required: false
        default: true

permissions:
  issues: write
  contents: read

jobs:
  recomendar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-mensual.txt

      - name: Generar el informe del mes
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GUARDAR: ${{ github.event.inputs.guardar || 'true' }}
          CON_DIV: ${{ github.event.inputs.con_dividendos || 'true' }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          # Sin IA ni titulares: solo se usaban en el paquete de 1–3 años, que está desactivado.
          EXTRA="--sin-ia"
          if [ "$GUARDAR" != "true" ]; then EXTRA="$EXTRA --sin-supabase"; fi
          if [ "$CON_DIV" != "true" ]; then EXTRA="$EXTRA --sin-dividendos"; fi
          python -m mensual.recomendador $EXTRA \
            --salida informe_mensual.json --md issue_mensual.md \
            --url-dashboard "https://${OWNER}.github.io/${REPO}/"

      - name: Mostrar el resumen en la página de la ejecución
        if: always()
        run: |
          if [ -f backend/issue_mensual.md ]; then
            cat backend/issue_mensual.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se generó informe (mira el log del paso anterior)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Abrir el Issue de aviso
        if: ${{ github.event.inputs.crear_issue != 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const propietario = context.repo.owner;
            const inf = JSON.parse(fs.readFileSync('backend/informe_mensual.json', 'utf8'));
            const cuerpoMd = fs.readFileSync('backend/issue_mensual.md', 'utf8');

            const ETIQUETA = 'mensual';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: ETIQUETA,
              });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo, name: ETIQUETA,
                color: '1d76db',
                description: 'Aviso mensual: oportunidades baratas frente a su propio historial',
              });
            }

            const paq = inf.paquetes || {};
            const nDiv = inf.dividendos && inf.dividendos.candidatas ? inf.dividendos.candidatas.length : null;
            let titulo;
            if (paq.medio || paq.largo || paq.lynch_g || paq.lynch_p || paq.calidad_g || nDiv != null) {
              const etiquetas = [['corto', '1–3 años'], ['medio', '3–5 años'], ['largo', '5+ años'],
                                 ['lynch_p', 'pequeñas'], ['calidad_g', 'grandes'], ['lynch_g', 'grandes (Lynch)']];
              const partes = etiquetas.filter(([k]) => paq[k]).map(([k, e]) => `${e} ${paq[k].candidatas.length}`);
              if (nDiv != null) partes.push(`dividendos ${nDiv}`);
              titulo = `📅 ${inf.mes}: ${partes.join(' · ')}`;
            } else {
              const n = inf.resumen.n_candidatas;
              titulo = n === 0
                ? `📅 ${inf.mes}: nada claramente barato este mes`
                : `📅 ${inf.mes}: ${n} candidata${n === 1 ? '' : 's'} — ${inf.candidatas.map(c => c.ticker).join(', ')}`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: titulo,
              body: `@${propietario}\n\n${cuerpoMd}`,
              assignees: [propietario],
              labels: [ETIQUETA],
            });

      - name: Guardar el informe como archivo descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-mensual
          path: |
            backend/informe_mensual.json
            backend/issue_mensual.md
          if-no-files-found: ignore
